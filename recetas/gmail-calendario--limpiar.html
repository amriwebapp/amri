<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#FBF6EE;--card:#FFFFFF;--ink:#2A1F14;--mute:#7A6A58;--line:#E6DACB;--acc:#D2561F;--ok:#2E8B57;--code:#2A1F14;--codeink:#FFEBD2;--soft:#FFF1E2}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17110B;--card:#221A12;--ink:#F6EBDC;--mute:#B3A18C;--line:#3A2E22;--acc:#F0854F;--ok:#4FC283;--code:#0E0A06;--soft:#2D2116}}
:root[data-theme="dark"]{--bg:#17110B;--card:#221A12;--ink:#F6EBDC;--mute:#B3A18C;--line:#3A2E22;--acc:#F0854F;--ok:#4FC283;--code:#0E0A06;--soft:#2D2116}
*{box-sizing:border-box}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 80px);scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Bricolage Grotesque",system-ui,sans-serif;line-height:1.6;font-size:17px}
main{max-width:760px;margin:0 auto;padding:26px 16px 60px}
h1{font-size:clamp(30px,7vw,48px);line-height:1.05;margin:0 0 10px;font-weight:800;letter-spacing:-.02em}
.meta{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 18px}
.meta span{background:var(--soft);border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:14px}
.ing{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 18px;margin-bottom:16px}
.ing h2{margin:0 0 8px;font-size:18px}.ing ul{margin:0;padding-left:20px}.ing li{margin:4px 0}
.pick{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:6px}
.chip{font:inherit;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:8px 14px;cursor:pointer}
.chip[aria-pressed=true]{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:700}
.prog{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:10px 0}
.bar{height:10px;background:var(--line);border-radius:10px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:var(--ok);transition:width .5s}
.pl{font-size:13px;color:var(--mute);margin-top:5px}
.step{background:var(--card);border:1px solid var(--line);border-radius:18px;margin-bottom:12px;overflow:hidden}
.step.done{border-color:var(--ok)}
.hd{all:unset;box-sizing:border-box;display:flex;gap:14px;align-items:center;width:100%;padding:16px;cursor:pointer}
.hd:focus-visible{outline:3px solid var(--acc);outline-offset:-3px}
.num{flex:none;display:grid;place-items:center;width:40px;height:40px;border-radius:50%;background:var(--line);font-weight:800}
.step.open .num{background:var(--acc);color:#fff}.step.done .num{background:var(--ok);color:#fff}
.tt{flex:1}.tt strong{display:block;font-size:19px}.tt small{color:var(--mute)}
.chev{transition:transform .25s;color:var(--mute)}.step.open .chev{transform:rotate(90deg)}
.bd{display:none;padding:0 18px 18px}
.step.open .bd{display:block;animation:in .3s}@keyframes in{from{opacity:0;transform:translateY(-4px)}}
.what{margin:0 0 10px;font-weight:500}
.bd h3{font-size:14px;text-transform:uppercase;letter-spacing:.06em;color:var(--acc);margin:16px 0 4px}
.bd ol{padding-left:22px;margin:4px 0}.bd li{margin:6px 0}
.bd a{color:var(--acc)}
.cb{position:relative;margin:10px 0}
.cb pre{margin:0;background:var(--code);color:var(--codeink);border-radius:12px;padding:14px 84px 14px 14px;font:15px/1.6 ui-monospace,Menlo,Consolas,monospace;white-space:pre-wrap;word-break:break-word}
.cb button{position:absolute;top:8px;right:8px;font:600 13px "Bricolage Grotesque",sans-serif;background:var(--acc);color:#fff;border:0;border-radius:8px;padding:6px 11px;cursor:pointer}
.check{background:color-mix(in srgb,var(--ok) 13%,transparent);border-radius:10px;padding:10px 12px;margin-top:14px;font-size:15px}
.tip{background:var(--soft);border-left:4px solid var(--acc);border-radius:8px;padding:10px 12px;font-size:15px;margin:10px 0}
details{border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin:10px 0;font-size:15px}
summary{cursor:pointer;font-weight:700}
details ul{padding-left:18px;margin:8px 0 2px}
.btn{font:inherit;font-weight:700;border-radius:12px;padding:11px 18px;cursor:pointer;border:0;background:var(--ink);color:var(--bg);margin-top:16px}
.btn:focus-visible,.chip:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.custom{display:none;margin:10px 0}.custom.show{display:block}
.custom textarea{width:100%;font:inherit;border:1.5px solid var(--line);border-radius:12px;padding:10px;background:var(--card);color:var(--ink);min-height:74px}
.yn{display:flex;gap:8px;align-items:center;margin:8px 0;flex-wrap:wrap}
.xt{margin:30px 0 4px;font-size:26px}.xs{color:var(--mute);margin:0 0 14px}
.step.x .num{border-radius:12px}
.fin{display:none;text-align:center;padding:26px;border:2px dashed var(--ok);border-radius:18px;margin-top:16px}
.fin.show{display:block;animation:in .5s}.fin h2{margin:0 0 6px}
.reset{background:none;border:0;color:var(--mute);text-decoration:underline;cursor:pointer;font:inherit;margin-top:18px}
.back{display:inline-flex;align-items:center;gap:6px;color:var(--mute);font-weight:600;font-size:15px;text-decoration:none;margin-bottom:16px;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 14px}
.back:hover{color:var(--acc);border-color:var(--acc)}
.foot{display:flex;justify-content:center;gap:18px;align-items:center;flex-wrap:wrap;margin-top:18px}
.abrand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:20px;letter-spacing:-.02em;color:var(--ink);text-decoration:none;margin-bottom:18px}
.abrand:hover{text-decoration:none}
.abrand .logo{width:34px;height:34px;border-radius:9px;overflow:hidden;display:block;flex:none;box-shadow:0 6px 16px -6px rgba(210,86,31,.6)}.abrand .logo img{width:100%;height:100%;display:block}.bwm{height:21px;width:auto;display:block;overflow:visible}.bwm .mr{stroke:currentColor}.bwm .ai{stroke:var(--acc)}.bwm .ais{fill:var(--acc)}
.abrand .sub{font-weight:600;font-size:14px;color:var(--mute);letter-spacing:0;padding-left:10px;border-left:1px solid var(--line)}
.afoot{text-align:center;color:var(--mute);font-size:14px;margin-top:34px;padding-top:18px;border-top:1px solid var(--line)}
.afoot a{color:var(--mute);font-weight:700;text-decoration:none}.afoot a:hover{color:var(--acc)}
</style>
