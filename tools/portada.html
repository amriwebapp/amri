<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Portada</title>
<!-- Plantilla de portada vertical de cada librito. La usa tools/portadas.py: ?s=<slug>&bg=<color>
     Diseño de colección: fondo de color del libro, un pictograma geométrico y el título. -->
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
html,body{width:600px;height:800px;overflow:hidden}
.cv{position:relative;width:600px;height:800px;overflow:hidden;background:var(--bg);font-family:"Bricolage Grotesque",system-ui,sans-serif;color:#1F1A14}
.cv::before{content:"";position:absolute;inset:0;background:radial-gradient(120% 70% at 50% 34%,rgba(255,255,255,.55),rgba(255,255,255,0) 70%)}
.top,.foot{position:absolute;left:48px;right:48px;display:flex;align-items:center;justify-content:space-between;font-size:15px;font-weight:700;letter-spacing:.18em;text-transform:uppercase}
.top{top:44px}.foot{bottom:40px;font-weight:600;letter-spacing:.14em;color:rgba(31,26,20,.62)}
.brand{display:flex;align-items:center;gap:12px}.brand img{width:30px;height:30px;border-radius:8px}
.no{font-variant-numeric:tabular-nums;color:rgba(31,26,20,.62)}
.hr{position:absolute;left:48px;right:48px;height:2px;background:rgba(31,26,20,.14)}
.hr.a{top:100px}.hr.b{bottom:86px}
.pic{position:absolute;left:50%;top:146px;width:316px;height:316px;margin-left:-158px}
.pic svg{width:100%;height:100%;overflow:visible}
.pic svg *{fill:none;stroke:#1F1A14;stroke-width:7;stroke-linecap:round;stroke-linejoin:round}
.pic svg .f{fill:#D2561F;stroke:#D2561F}
.pic svg .k{fill:#1F1A14}
.pic svg .w{fill:#FFFDF9}
h1{position:absolute;left:48px;right:48px;bottom:118px;font-weight:800;font-size:54px;line-height:1.02;letter-spacing:-.035em;text-wrap:balance}
</style>
</head>
<body>
<div class="cv" id="cv">
  <div class="top"><span class="brand"><img src="../img/brand/amri-monograma.svg" alt="">Libro de recetas</span><span class="no" id="no"></span></div>
  <div class="hr a"></div>
  <div class="pic" id="pic"></div>
  <h1 id="t"></h1>
  <div class="hr b"></div>
  <div class="foot"><span id="n"></span><span>amri.es</span></div>
</div>
<script src="../i18n.js"></script>
<script src="../assets/datos.js"></script>
<script src="../assets/libros.js"></script>

(function(){
var q=new URLSearchParams(location.search),s=q.get("s");
document.getElementById("cv").style.setProperty("--bg",q.get("bg")||"#FBE3D2");
document.getElementById("pic").innerHTML='<svg viewBox="0 0 240 240">'+(P[s]||"")+'</svg>';
var t=document.getElementById("t");t.textContent=AMRI_DATA.title(s);
var i=(AMRI_DATA.buildOrder||[]).indexOf(s);document.getElementById("no").textContent=i>-1?"Nº "+String(i+1).padStart(2,"0"):"";
var n=((window.AMRI_LIBROS||{})[s]||[]).length;document.getElementById("n").textContent=n?n+(n===1?" receta":" recetas"):"";
/* El título cabe en tres líneas como máximo: se encoge si es largo */
function fit(){var f=54;t.style.fontSize=f+"px";while(t.offsetHeight>f*1.02*3+4&&f>34){f-=2;t.style.fontSize=f+"px";}document.title="ok";}
document.fonts.ready.then(fit);
})();
